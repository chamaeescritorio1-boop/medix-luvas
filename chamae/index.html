<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chamae · Sistema (teste)</title>
<meta name="theme-color" content="#0e1120">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1120;--surface:#171b2e;--surface2:#1d2340;--ink:#eef0f7;--muted:#9aa1b8;--line:#272d47;--accent:#f2b632;--accent-ink:#1c1600;--ok:#4fd18b;--bad:#ff7a70;--warn:#f2b632;
 --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0} [hidden]{display:none!important}
body{font-family:var(--body);background:radial-gradient(1200px 600px at 80% -10%,#24305e 0,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);min-height:100vh;padding-bottom:80px}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:rgba(14,17,32,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px}
.hrow{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hrow img{width:34px;height:34px;border-radius:50%}
h1{font-family:var(--display);font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:0;flex:1}
h1 span{color:var(--accent)} h1 small{font-family:var(--body);font-size:11px;letter-spacing:0;color:var(--muted);text-transform:none;margin-left:6px}
main{max-width:1100px;margin:0 auto;padding:14px 16px}
.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
.btn.ghost{background:var(--surface2);color:var(--ink)} .btn.sm{padding:7px 11px;font-size:13px} .btn:disabled{opacity:.5}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input,select,textarea{font-family:inherit;font-size:15px;padding:11px;border-radius:12px;border:1px solid var(--line);background:#11152a;color:var(--ink);min-width:0}
label.f{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
.sec{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.grid{display:grid;gap:12px}
.reps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} @media(min-width:760px){.reps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rep{border:1px solid var(--line);border-radius:20px;padding:16px;min-height:118px;display:grid;align-content:space-between;gap:10px;cursor:pointer;color:var(--ink);text-align:left;background:linear-gradient(160deg,var(--c,#2a3157) -40%,var(--surface) 70%);font-family:inherit}
.rep b{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.rep small{color:var(--muted)} .rep.off{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px} @media(max-width:560px){.r2{grid-template-columns:1fr}}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pc{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:start}
.pc img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:12px}
.pc .cod{font-family:var(--display);font-size:19px;letter-spacing:.02em}
.pc .d{font-size:13px;color:var(--muted);line-height:1.3}
.pc .pr{font-size:20px;font-weight:700;color:var(--accent)} .pc .pr small{font-size:12px;color:var(--muted);font-weight:500}
.tags{display:flex;gap:4px;flex-wrap:wrap} .tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#21263d;color:var(--ink)}
.qty{display:flex;align-items:center;gap:6px} .qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:18px;cursor:pointer} .qty input{width:70px;text-align:center;padding:7px}
table.t{width:100%;border-collapse:collapse;font-size:13px} table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} table.t .n{text-align:right;white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:26px;margin-top:8px} .tot b{color:var(--accent)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(14,17,32,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 4px 12px;font-size:12px;font-weight:600;display:grid;justify-items:center;gap:2px;cursor:pointer;font-family:inherit}
nav button svg{width:22px;height:22px} nav button.on{color:var(--ink)} nav button.on svg{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#eef0f7;color:#111;padding:10px 14px;border-radius:12px;z-index:50;font-size:14px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{width:100%;max-width:340px;display:grid;gap:12px;text-align:center}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.diff{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.badge{display:inline-block;min-width:18px;padding:1px 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800}
.ov{position:fixed;inset:0;z-index:30;background:rgba(6,8,18,.7);display:flex;align-items:flex-end;justify-content:center}
.ov .sh{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px} @media(min-width:700px){.ov{align-items:center}.ov .sh{border-radius:20px}}
</style>
</head>
<body>
<header><div class="hrow"><a href="#" id="homeLnk" style="display:flex;align-items:center;gap:10px;flex:1;color:inherit;text-decoration:none" aria-label="Ir para o início"><img src="icon-192.png" alt=""><h1>Chamae <span>·</span> Sistema<small>teste</small></h1></a><button class="chip" id="homeBtn" type="button">⌂ Início</button><button class="chip" id="who" hidden></button></div></header>
<main id="main"></main>
<nav id="nav" hidden>
 <button data-go="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H5v-9"/></svg>Início</button>
 <button data-go="orc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l3 3v15H6z M9 10h6M9 14h6M9 18h4"/></svg><span>Orçamento <span class="badge" id="qn" hidden>0</span></span></button>
 <button data-go="admin" id="navAdm" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="18" cy="18" r="3"/></svg>Produtos</button>
</nav>
<div id="lock"><form id="lf"><img src="icon-192.png" alt="" width="84" height="84" style="margin:0 auto;border-radius:50%">
 <div style="font-family:var(--display);font-size:26px;text-transform:uppercase">Sistema Chamae</div><div class="hint">Versão de teste · entre com seu usuário</div>
 <input id="le" type="email" autocomplete="username" placeholder="E-mail" required aria-label="E-mail"><input id="ls" type="password" autocomplete="current-password" placeholder="Senha" required aria-label="Senha">
 <button class="btn" type="submit">Entrar</button><div id="lerr" class="bad" style="font-size:13px;min-height:18px"></div></form></div>
<script src="xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
