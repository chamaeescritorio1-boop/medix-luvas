<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chamae · Sistema (teste)</title>
<meta name="theme-color" content="#0e1120">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1120;--surface:#171b2e;--surface2:#1d2340;--ink:#eef0f7;--muted:#9aa1b8;--line:#272d47;--accent:#f2b632;--accent-ink:#1c1600;--ok:#4fd18b;--bad:#ff7a70;--warn:#f2b632;
 --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0} [hidden]{display:none!important}
body{font-family:var(--body);background:radial-gradient(1200px 600px at 80% -10%,#24305e 0,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);min-height:100vh;padding-bottom:80px}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:rgba(14,17,32,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px}
.hrow{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hrow img{width:34px;height:34px;border-radius:50%}
h1{font-family:var(--display);font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:0;flex:1}
h1 span{color:var(--accent)} h1 small{font-family:var(--body);font-size:11px;letter-spacing:0;color:var(--muted);text-transform:none;margin-left:6px}
main{max-width:1100px;margin:0 auto;padding:14px 16px}
.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
.btn.ghost{background:var(--surface2);color:var(--ink)} .btn.sm{padding:7px 11px;font-size:13px} .btn:disabled{opacity:.5}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input,select,textarea{font-family:inherit;font-size:15px;padding:11px;border-radius:12px;border:1px solid var(--line);background:#11152a;color:var(--ink);min-width:0}
label.f{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
.sec{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.grid{display:grid;gap:12px}
.reps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} @media(min-width:760px){.reps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rep{border:1px solid var(--line);border-radius:20px;padding:16px;min-height:118px;display:grid;align-content:space-between;gap:10px;cursor:pointer;color:var(--ink);text-align:left;background:linear-gradient(160deg,var(--c,#2a3157) -40%,var(--surface) 70%);font-family:inherit}
.rep b{font-family:var(--display);font-size:21px;overflow-wrap:anywhere;text-transform:uppercase;letter-spacing:.02em}
.rep small{color:var(--muted)} .rep.off{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px} @media(max-width:560px){.r2{grid-template-columns:1fr}}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pc{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:start}
.pc img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:12px}
.pc .cod{font-family:var(--display);font-size:19px;letter-spacing:.02em}
.pc .d{font-size:13px;color:var(--muted);line-height:1.3}
.pc .pr{font-size:20px;font-weight:700;color:var(--accent)} .pc .pr small{font-size:12px;color:var(--muted);font-weight:500}
.tags{display:flex;gap:4px;flex-wrap:wrap} .tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#21263d;color:var(--ink)}
.qty{display:flex;align-items:center;gap:6px} .qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:18px;cursor:pointer} .qty input{width:70px;text-align:center;padding:7px}
table.t{width:100%;border-collapse:collapse;font-size:13px} table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} table.t .n{text-align:right;white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:26px;margin-top:8px} .tot b{color:var(--accent)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(14,17,32,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 4px 12px;font-size:12px;font-weight:600;display:grid;justify-items:center;gap:2px;cursor:pointer;font-family:inherit}
nav button svg{width:22px;height:22px} nav button.on{color:var(--ink)} nav button.on svg{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#eef0f7;color:#111;padding:10px 14px;border-radius:12px;z-index:50;font-size:14px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{width:100%;max-width:340px;display:grid;gap:12px;text-align:center}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.diff{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.badge{display:inline-block;min-width:18px;padding:1px 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800}
.ov{position:fixed;inset:0;z-index:30;background:rgba(6,8,18,.7);display:flex;align-items:flex-end;justify-content:center}
.ov .sh{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px} @media(min-width:700px){.ov{align-items:center}.ov .sh{border-radius:20px}}
:root[data-theme=light]{--bg:#f3f4f8;--surface:#ffffff;--surface2:#eceef5;--ink:#1c2340;--muted:#5d6480;--line:#dcdfea;--accent:#1c2340;--accent-ink:#fff;--ok:#1f9d55;--bad:#c62828;--warn:#b7791f;color-scheme:light}
:root[data-theme=light] body{background:var(--bg)} :root[data-theme=light] header{background:rgba(255,255,255,.92)} :root[data-theme=light] nav{background:rgba(255,255,255,.96)}
:root[data-theme=light] input,:root[data-theme=light] select,:root[data-theme=light] textarea{background:#fff} :root[data-theme=light] .tag{background:#eceef5} :root[data-theme=light] .pc .pr{color:#1c2340}
:root[data-lay=classico] body{background:var(--bg)} :root[data-lay=classico] .card,:root[data-lay=classico] .rep{background:var(--surface);border-radius:12px} :root[data-lay=classico] .rep{border-left:5px solid var(--c,#2a3157)}
.sem{display:grid;gap:12px;margin-top:10px} @media(min-width:900px){.sem{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){body{padding-bottom:0;padding-left:96px} nav{top:0;bottom:0;right:auto;width:96px;flex-direction:column;justify-content:flex-start;padding-top:80px;border-top:0;border-right:1px solid var(--line)} nav button{flex:0 0 auto;padding:14px 4px}
 main,.hrow{max-width:1320px} .reps{grid-template-columns:repeat(6,minmax(0,1fr))} .pl{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))} .toast{bottom:24px} .ov .sh{max-width:1100px}}
@media(max-width:600px){.hrow .lbl{display:none}}
.ricon{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;flex:0 0 auto;overflow:hidden;background:#fff;vertical-align:middle;font-family:var(--body);letter-spacing:0}
.ricon img{width:100%;height:100%;object-fit:contain}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} @media(min-width:900px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface2);border-radius:14px;padding:12px;display:grid;gap:3px}.kpi b{font-family:var(--display);font-size:26px}.kpi small{color:var(--muted);font-size:12px}
.spark{width:100%;height:auto;background:var(--surface2);border-radius:14px}.spark .sv{fill:var(--muted);font-size:11px}
.dgrid{display:grid;gap:14px} @media(min-width:900px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;padding:5px 0;cursor:pointer;text-align:left}
.bar .bl{display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.bar .bt{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}.bar .bt i{display:block;height:100%;border-radius:6px}
.bar.on{outline:2px solid var(--accent);border-radius:8px}
@media(max-width:520px){nav button{font-size:9.5px;padding:9px 1px 11px;letter-spacing:-.2px} nav button svg{width:20px;height:20px}}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}
@media(min-width:1300px){.kanban{grid-auto-flow:row;grid-template-columns:repeat(6,minmax(0,1fr))}}
.kcol{display:grid;gap:8px;align-content:start;scroll-snap-align:start}
.khead{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-top-width:3px!important}
.khead b{font-size:13px;text-transform:uppercase;letter-spacing:.03em}.khead .hint{font-size:11px;text-align:right}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;cursor:pointer;transition:border-color .15s,transform .15s}
.kcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.ftopo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}@media(min-width:700px){.ftopo{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ftopo>div{background:var(--surface2);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:0}.ftopo small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.ftopo b{font-size:14px;overflow-wrap:anywhere}
.ftopo .ft-big{grid-column:1/-1}.ftopo .ft-big b{font-size:17px}
.ptab{display:grid;gap:6px}
.ptab .ph,.ptab .pr{display:grid;grid-template-columns:120px 170px minmax(200px,1fr) 130px 130px 190px;gap:12px;align-items:center;padding:10px 14px}
.ptab .ph{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ptab .pr{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sc);border-radius:12px;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.ptab .pr:hover{border-color:var(--accent);border-left-color:var(--sc)}
.ptab .pr>span{display:grid;gap:2px;min-width:0;font-size:13px}.ptab small{color:var(--muted);font-size:11px}.ptab .lk{color:#5aa9ff}
.ptab .c-rep{display:flex!important;align-items:center;gap:8px}.ptab .c-cli b{overflow-wrap:anywhere}.ptab .c-val b{font-size:15px}
.tg{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--ink)}.tg-r{background:#1f6fd122;color:#5aa9ff}.tg-b{background:#f2b63233;color:#d39b00}.tg-s{background:#4fd18b22;color:#2e9e62}
@media(max-width:900px){.ptab .ph{display:none}.ptab .pr{grid-template-columns:1fr auto;grid-template-areas:"cli val" "rep st" "num ven";row-gap:6px}
 .ptab .c-cli{grid-area:cli}.ptab .c-val{grid-area:val;text-align:right}.ptab .c-rep{grid-area:rep}.ptab .c-st{grid-area:st;justify-items:end}.ptab .c-num{grid-area:num;grid-auto-flow:column;justify-content:start;gap:8px}.ptab .c-ven{grid-area:ven;text-align:right;color:var(--muted)}}
@media(max-width:700px){#balls .reps{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px}#balls .rep{min-height:62px!important;padding:8px;border-radius:12px}#balls .rep small{font-size:10px}#balls .rep b{font-size:18px!important}}
</style>
</head>
<body>
<header><div class="hrow"><a href="#" id="homeLnk" style="display:flex;align-items:center;gap:10px;flex:1;color:inherit;text-decoration:none" aria-label="Ir para o início"><img src="icon-192.png" alt=""><h1>Chamae <span>·</span> Sistema<small>versão anterior</small></h1></a><button class="chip" id="srchBtn" type="button" aria-label="Buscar">🔍<span class="lbl"> Buscar</span></button><button class="chip" id="homeBtn" type="button" aria-label="Início">⌂<span class="lbl"> Início</span></button><button class="chip" id="who" hidden></button></div></header>
<main id="main"></main>
<nav id="nav" hidden>
 <button data-go="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H5v-9"/></svg>Início</button>
 <button data-go="cli"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c2 .7 3.2 2.5 3.6 5.4"/></svg>Clientes</button>
 <button data-go="tar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 15l2 2 4-4"/></svg><span>Tarefas <span class="badge" id="tn" hidden>0</span></span></button>
 <button data-go="orc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l3 3v15H6z M9 10h6M9 14h6M9 18h4"/></svg><span>Orçamento <span class="badge" id="qn" hidden>0</span></span></button>
 <button data-go="ped"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Pedidos</button>
 <button data-go="prod"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>Produtos</button>
 <button data-go="mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Mais</button><span id="navAdm" hidden></span>
</nav>
<div id="lock"><form id="lf"><img src="icon-192.png" alt="" width="84" height="84" style="margin:0 auto;border-radius:50%">
 <div style="font-family:var(--display);font-size:26px;text-transform:uppercase">Sistema Chamae</div><div class="hint">Versão de teste · entre com seu usuário</div>
 <input id="le" type="email" autocomplete="username" placeholder="E-mail" required aria-label="E-mail"><input id="ls" type="password" autocomplete="current-password" placeholder="Senha" required aria-label="Senha">
 <button class="btn" type="submit">Entrar</button><button class="chip" type="button" id="lcria">Criar meu acesso (equipe)</button><div id="lerr" class="bad" style="font-size:13px;min-height:18px"></div></form></div>
<script src="app.js?v=202610192237"></script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
