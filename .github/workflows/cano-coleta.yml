name: Coleta cano luvas Medix (uma vez)
on:
  push:
    branches: [claude/project-thread-aqoe2j]
    paths: ['.github/scripts/cano_in.json','.github/scripts/cano_coleta.py']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pypdf
      - run: python3 .github/scripts/cano_coleta.py
      - run: |
          git config user.name "medix-bot"; git config user.email "actions@users.noreply.github.com"
          git add cano_out.json; git commit -m "Coleta cano luvas Medix" && git push
